<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vua Marketing - Quản lý Tương tác</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- Sidebar bên trái -->
    <aside class="w-64 bg-white border-r flex flex-col justify-between shrink-0">
        <div>
            <div class="p-4 font-bold text-lg text-blue-600 border-b flex items-center gap-2">
                <span>👑</span> VUA MARKETING
            </div>
            <nav class="p-2 space-y-1">
                <div class="px-4 py-2 text-gray-700 font-medium">📌 Cào bài viết Face...</div>
                <div class="pl-4 space-y-1 text-sm">
                    <button onclick="switchTab('danh-sach')" id="btn-danh-sach" class="w-full text-left py-1.5 px-3 rounded text-gray-600 hover:bg-gray-100 font-medium">Danh sách</button>
                    <button onclick="switchTab('comments')" id="btn-comments" class="w-full text-left py-1.5 px-3 rounded text-blue-600 font-semibold bg-blue-50">Comments</button>
                    <button onclick="switchTab('orders')" id="btn-orders" class="w-full text-left py-1.5 px-3 rounded text-gray-600 hover:bg-gray-100 font-medium">Orders</button>
                </div>
                <button onclick="switchTab('ads')" id="btn-ads" class="w-full text-left px-4 py-2.5 rounded text-gray-700 hover:bg-gray-100 font-medium mt-1">📊 Ads Library</button>
                <button onclick="switchTab('tai-khoan')" id="btn-tai-khoan" class="w-full text-left px-4 py-2.5 rounded text-gray-700 hover:bg-gray-100 font-medium">👤 Tài khoản</button>
                <button onclick="switchTab('nhan-vien')" id="btn-nhan-vien" class="w-full text-left px-4 py-2.5 rounded text-gray-700 hover:bg-gray-100 font-medium">⚙️ Quản lý nhân viên</button>
            </nav>
        </div>
        <div class="p-4 border-t flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700">thanhhai</span>
            <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-bold">VIP</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        
        <!-- Tab 1: Danh sách link quét -->
        <div id="tab-danh-sach" class="tab-content hidden p-6">
            <header class="border-b pb-4 mb-4 flex justify-between items-center bg-white p-4 rounded shadow-sm">
                <h1 class="font-semibold text-xl text-gray-800">Quản lý Danh sách Link Bài viết</h1>
                <button onclick="addLinks()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">+ Thêm Link Quét</button>
            </header>
            <div class="bg-white p-6 rounded shadow-sm border space-y-4">
                <textarea id="linkInputArea" rows="4" placeholder="Dán danh sách link bài viết / video Facebook vào đây (mỗi link một dòng)..." class="w-full border rounded p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
            </div>
        </div>

        <!-- Tab 2: Comments -->
        <div id="tab-comments" class="tab-content flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b px-6 py-3 flex justify-between items-center shrink-0">
                <h1 class="font-semibold text-gray-800">Comments & Lọc số điện thoại (Tự động cập nhật ngầm)</h1>
                <span id="commentCount" class="text-sm text-blue-600 font-medium">0 comment</span>
            </header>

            <div class="p-6">
                <div class="bg-white p-4 rounded-lg shadow-sm border mb-4 flex items-center gap-4 text-sm">
                    <input type="text" placeholder="Tìm kiếm nhanh..." class="border rounded px-3 py-1.5 w-60">
                    <button onclick="exportData()" class="bg-gray-100 px-3 py-1.5 rounded border hover:bg-gray-200 font-medium text-gray-700">Export Data</button>
                </div>

                <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs text-gray-500 uppercase">
                                <th class="p-3"><input type="checkbox"></th>
                                <th class="p-3">STT</th>
                                <th class="p-3">Thời gian</th>
                                <th class="p-3">Bài viết</th>
                                <th class="p-3">Tên</th>
                                <th class="p-3">Bình luận</th>
                                <th class="p-3">Số điện thoại</th>
                                <th class="p-3">Trạng thái</th>
                                <th class="p-3 text-right">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="commentTableBody" class="text-sm divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://vuamarketing.onrender.com';

        let currentCommentsData = [];
        const allTabs = ['danh-sach', 'comments', 'orders', 'ads', 'tai-khoan', 'nhan-vien'];

        function switchTab(tabName) {
            allTabs.forEach(name => {
                const el = document.getElementById('tab-' + name);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById('tab-' + tabName);
            if(target) target.classList.remove('hidden');
        }

        async function loadComments() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/comments`);
                const data = await response.json();
                currentCommentsData = data;
                
                const tbody = document.getElementById('commentTableBody');
                const countBadge = document.getElementById('commentCount');
                if(!tbody) return;
                
                tbody.innerHTML = '';
                countBadge.innerText = data.length + " comment";

                data.forEach((item, index) => {
                    const phoneDisplay = item.phone ? `<span class="text-blue-600 font-bold">${item.phone}</span>` : `<span class="text-gray-400">-</span>`;
                    
                    // Bắt buộc gắn link trực tiếp từ database trả về
                    const postLink = item.postUrl || 'https://www.facebook.com';
                    const profileLink = item.profileUrl || 'https://www.facebook.com';

                    const row = `
                        <tr>
                            <td class="p-3"><input type="checkbox"></td>
                            <td class="p-3">${index + 1}</td>
                            <td class="p-3 text-xs text-gray-500">${item.time}</td>
                            <td class="p-3 font-medium">
                                <a href="${postLink}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline font-semibold" style="color: #2563eb; text-decoration: underline;">
                                    ${item.post}
                                </a>
                            </td>
                            <td class="p-3">
                                <a href="${profileLink}" target="_blank" rel="noopener noreferrer" class="font-medium text-blue-600 hover:underline" style="color: #2563eb; text-decoration: underline;">
                                    ${item.name} 👤
                                </a>
                            </td>
                            <td class="p-3">${item.comment}</td>
                            <td class="p-3">${phoneDisplay}</td>
                            <td class="p-3"><span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">Chưa đặt</span></td>
                            <td class="p-3 text-right"><button class="bg-gray-100 border px-3 py-1 rounded text-xs hover:bg-gray-200">🛒 Tạo đơn</button></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
        }

        function exportData() {
            if (!currentCommentsData || currentCommentsData.length === 0) return alert('Chưa có dữ liệu!');
            let csvContent = "\uFEFFSTT,Thời gian,Bài viết,Link Bài Viết,Tên,Link Facebook,Bình luận,Số điện thoại\n";
            currentCommentsData.forEach((item, index) => {
                csvContent += [index + 1, `"${item.time}"`, `"${item.post}"`, `"${item.postUrl || ''}"`, `"${item.name}"`, `"${item.profileUrl || ''}"`, `"${item.comment}"`, `"${item.phone || ''}"`].join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `danh_sach_comment.csv`;
            link.click();
        }

        window.onload = function() {
            loadComments();
            setInterval(loadComments, 5000);
        };
    </script>
</body>
</html>
